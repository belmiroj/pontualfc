<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lançar Resultados - Pontual FC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Lançar Resultado e Scout</h2>
        
        <div class="form-group">
            <label>Selecione a Rodada:</label>
            <select id="selectRodada" onchange="carregarDadosDaRodada()"></select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Gols Pontual:</label>
                <input type="number" id="gp" value="0">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Gols Adversário:</label>
                <input type="number" id="ga" value="0">
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>✔</th>
                        <th>Jogador</th>
                        <th>Gols</th>
                        <th>Ast</th>
                        <th>Votos</th>
                    </tr>
                </thead>
                <tbody id="tabelaScout">
                    <!-- Gerado via JS -->
                </tbody>
            </table>
        </div>

        <button class="btn btn-primary" onclick="finalizarPartida()">Salvar Resultado Final</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/resultados.js"></script>
</body>
</html>
