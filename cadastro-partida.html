<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Partida - Pontual FC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Nova Partida</h2>
        <div class="form-group">
            <label>Rodada (Identificador):</label>
            <input type="text" id="rodada" placeholder="Ex: 2026_01">
        </div>
        <div class="form-group">
            <label>Data:</label>
            <input type="date" id="data">
        </div>
        <div class="form-group">
            <label>Adversário:</label>
            <input type="text" id="adversario" value="A Definir">
        </div>
        <button class="btn btn-primary" onclick="salvarNoBanco()">Agendar Partida</button>
        <div class="text-center mt-3">
            <a href="index.html">Voltar ao Painel</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
